<style>
  :root {
    --navy: #0f2647;
    --navy-light: #1c3d6e;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --bg: #f8fafc;
    --white: #ffffff;
    --amber: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    color: white;
    padding: 22px 28px;
  }
  header h1 { margin: 0 0 4px 0; font-size: 21px; font-weight: 700; }
  header p { margin: 0; font-size: 13px; color: #cbd5e1; }

  .stats-bar {
    display: flex;
    gap: 12px;
    padding: 14px 28px;
    background: white;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--accent-light);
    color: var(--navy);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 600;
  }
  .stat-chip b { font-size: 15px; color: var(--accent); margin-right: 4px;}

  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 28px;
    background: white;
    border-bottom: 2px solid var(--border);
    overflow-x: auto;
  }
  .tab-btn {
    padding: 12px 18px;
    background: none;
    border: none;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab-btn:hover:not(.active) { color: var(--text); }

  .container { padding: 20px 28px 40px; max-width: 1600px; margin: 0 auto; }

  .filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    background: white;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .filters input[type=text] {
    flex: 1 1 260px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13.5px;
  }
  .filters select {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13.5px;
    background: white;
    min-width: 180px;
  }
  .filters button {
    padding: 9px 16px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 7px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    color: var(--text-muted);
  }
  .filters button:hover { background: #eef2f7; }

  .table-wrap {
    background: white;
    border-radius: 10px;
    border: 1px solid var(--border);
    overflow: auto;
    max-height: 68vh;
  }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0;
    background: var(--navy);
    color: white;
    text-align: left;
    padding: 10px 10px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    z-index: 2;
  }
  thead th:hover { background: var(--navy-light); }
  thead th .arrow { opacity: 0.5; font-size: 10px; margin-left: 4px; }
  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    max-width: 320px;
  }
  tbody tr:hover { background: var(--accent-light); }
  tbody tr:nth-child(even) { background: #fafbfc; }
  tbody tr:nth-child(even):hover { background: var(--accent-light); }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 700;
  }
  .badge.amber { background: #fef3c7; color: var(--amber); }
  .empty-state { padding: 40px; text-align: center; color: var(--text-muted); }

  .pagination {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px; font-size: 13px; color: var(--text-muted);
    flex-wrap: wrap;
  }
  .pagination button {
    padding: 6px 12px; border: 1px solid var(--border); background: white;
    border-radius: 6px; cursor: pointer; font-size: 12.5px;
  }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pagination button:hover:not(:disabled) { background: var(--accent-light); }

  .hospital-tag {
    display: inline-block;
    background: #f1f5f9;
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 11px;
    margin: 1px 2px 1px 0;
    color: var(--navy);
    border: 1px solid var(--border);
  }
  .company-name { font-weight: 600; }
  .muted { color: var(--text-muted); font-size: 11.5px; }
  footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 12px; }

  .pie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .pie-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pie-card-header .badge { margin-bottom: 4px; }
  .pie-card-group { font-weight: 700; font-size: 13px; color: var(--navy); margin-top: 2px; }
  .pie-card-body { display: flex; gap: 14px; align-items: center; }
  .pie-svg-wrap { flex: 0 0 auto; }
  .pie-svg-wrap svg { display: block; }
  .pie-legend { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 5px; max-height: 200px; overflow-y: auto; }
  .pie-legend-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; line-height: 1.35; }
  .pie-swatch { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .pie-legend-name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; color: var(--text); }
  .pie-legend-pct { flex: 0 0 auto; font-weight: 700; color: var(--navy); white-space: nowrap; }
  .pie-card-footer { border-top: 1px dashed var(--border); padding-top: 6px; font-size: 11.5px; }
  .pie-hint { grid-column: 1 / -1; }
</style>
</head>

<script>
let DATA = { details: [], ranking: [], groups: [], hospitals: [], overview: [] };

function fmtVND(n) {
  if (n === null || n === undefined || n === '') return '—';
  return Number(n).toLocaleString('vi-VN') + ' đ';
}
function fmtNum(n) {
  if (n === null || n === undefined || n === '') return '—';
  return Number(n).toLocaleString('vi-VN');
}
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const TABS = {
  overview: {
    label: 'Tổng hợp đối thủ (toàn bộ bệnh viện)',
    get data() { return DATA.overview; },
    columns: [
      {key: 'contractor', label: 'Nhà thầu (đối thủ)', sortable: true, render: r => `<span class="company-name">${esc(r.contractor)}</span>`},
      {key: 'num_hospitals', label: 'Số BV xuất hiện', sortable: true, cls: 'num', render: r => `<span class="badge">${r.num_hospitals}</span>`},
      {key: 'num_tenders', label: 'Số mã thầu', sortable: true, cls: 'num'},
      {key: 'num_packages', label: 'Số gói thắng', sortable: true, cls: 'num'},
      {key: 'total_value', label: 'Tổng giá trị (VNĐ)', sortable: true, cls: 'num', render: r => fmtVND(r.total_value)},
      {key: 'hospitals', label: 'Danh sách bệnh viện', render: r => r.hospitals.map(h => `<span class="hospital-tag">${esc(h)}</span>`).join('')},
    ],
    searchFields: ['contractor', 'hospitals'],
    hospitalField: 'hospitals',
    defaultSort: {key: 'num_hospitals', dir: 'desc'},
  },
  ranking: {
    label: 'Xếp hạng nhà thầu theo mã thầu',
    get data() { return DATA.ranking; },
    columns: [
      {key: 'hospital', label: 'Bệnh viện', sortable: true},
      {key: 'tender_code', label: 'Mã thầu', sortable: true},
      {key: 'contractor', label: 'Nhà thầu (đối thủ)', sortable: true, render: r => `<span class="company-name">${esc(r.contractor)}</span>`},
      {key: 'num_groups', label: 'Số nhóm SP trùng', sortable: true, cls: 'num'},
      {key: 'num_packages', label: 'Số gói thắng', sortable: true, cls: 'num'},
      {key: 'total_value', label: 'Tổng giá trị (VNĐ)', sortable: true, cls: 'num', render: r => fmtVND(r.total_value)},
    ],
    searchFields: ['hospital', 'tender_code', 'contractor'],
    hospitalField: 'hospital',
    contractorField: 'contractor',
    defaultSort: {key: 'total_value', dir: 'desc'},
  },
  pie: {
    label: 'Tỷ trọng nhà thầu theo mã thầu (dạng biểu đồ tròn)',
    get data() { return DATA.ranking; },
    columns: [],
    searchFields: ['tender_code', 'contractor'],
    hospitalField: 'hospital',
    defaultSort: null,
  },
  groups: {
    label: 'Đối thủ theo nhóm sản phẩm',
    get data() { return DATA.groups; },
    columns: [
      {key: 'hospital', label: 'Bệnh viện', sortable: true},
      {key: 'group', label: 'Nhóm SP (theo ABC)', sortable: true},
      {key: 'abc_product', label: 'Sản phẩm ABC tương ứng'},
      {key: 'tender_code', label: 'Mã thầu', sortable: true},
      {key: 'contractor', label: 'Nhà thầu (đối thủ)', sortable: true, render: r => `<span class="company-name">${esc(r.contractor)}</span>`},
      {key: 'manufacturer_brand', label: 'Hãng SX / Nhãn hiệu'},
      {key: 'num_packages', label: 'Số gói thắng', sortable: true, cls: 'num'},
      {key: 'total_value', label: 'Tổng giá trị (VNĐ)', sortable: true, cls: 'num', render: r => fmtVND(r.total_value)},
    ],
    searchFields: ['hospital', 'group', 'abc_product', 'tender_code', 'contractor', 'manufacturer_brand'],
    hospitalField: 'hospital',
    contractorField: 'contractor',
    defaultSort: {key: 'total_value', dir: 'desc'},
  },
  details: {
    label: 'Chi tiết vật tư trúng thầu',
    get data() { return DATA.details; },
    columns: [
      {key: 'hospital', label: 'Bệnh viện', sortable: true},
      {key: 'source', label: 'Mã thầu', sortable: true},
      {key: 'group', label: 'Nhóm SP'},
      {key: 'winner', label: 'Nhà thầu trúng thầu', sortable: true, render: r => `<span class="company-name">${esc(r.winner)}</span>`},
      {key: 'item', label: 'Tên hàng hóa'},
      {key: 'brand', label: 'Nhãn hiệu'},
      {key: 'manufacturer', label: 'Hãng sản xuất'},
      {key: 'origin', label: 'Xuất xứ'},
      {key: 'unit', label: 'ĐVT'},
      {key: 'qty', label: 'KL', cls: 'num', render: r => fmtNum(r.qty)},
      {key: 'price', label: 'Đơn giá', cls: 'num', render: r => fmtVND(r.price)},
      {key: 'total', label: 'Thành tiền', sortable: true, cls: 'num', render: r => fmtVND(r.total)},
      {key: 'spec', label: 'Cấu hình kỹ thuật', render: r => `<div style="max-width:420px; white-space:pre-line;">${esc(r.spec) || '—'}</div>`},
    ],
    searchFields: ['hospital', 'source', 'group', 'package', 'winner', 'item', 'brand', 'manufacturer', 'origin', 'spec'],
    hospitalField: 'hospital',
    contractorField: 'winner',
    defaultSort: null,
  },
};

let state = {
  tab: 'overview',
  search: '',
  hospital: '',
  contractor: '',
  sortKey: null,
  sortDir: 'asc',
  page: 1,
  pageSize: 50,
};

function getFieldValue(row, field) {
  // supports array fields like hospitals
  const v = row[field];
  return v;
}

function matchesHospital(row, cfg, hospital) {
  if (!hospital) return true;
  const v = row[cfg.hospitalField];
  if (Array.isArray(v)) return v.includes(hospital);
  return v === hospital;
}

function matchesContractor(row, cfg, contractor) {
  if (!contractor || !cfg.contractorField) return true;
  return row[cfg.contractorField] === contractor;
}

function matchesSearch(row, cfg, term) {
  if (!term) return true;
  const t = term.toLowerCase();
  return cfg.searchFields.some(f => {
    const v = row[f];
    if (Array.isArray(v)) return v.join(' ').toLowerCase().includes(t);
    return v && String(v).toLowerCase().includes(t);
  });
}

function getFiltered() {
  const cfg = TABS[state.tab];
  let rows = cfg.data.filter(r =>
    matchesSearch(r, cfg, state.search) &&
    matchesHospital(r, cfg, state.hospital) &&
    matchesContractor(r, cfg, state.contractor)
  );
  const sortKey = state.sortKey || (cfg.defaultSort && cfg.defaultSort.key);
  const sortDir = state.sortKey ? state.sortDir : (cfg.defaultSort ? cfg.defaultSort.dir : 'asc');
  if (sortKey) {
    rows = rows.slice().sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (Array.isArray(av)) av = av.length;
      if (Array.isArray(bv)) bv = bv.length;
      if (typeof av === 'number' && typeof bv === 'number') return sortDir === 'asc' ? av - bv : bv - av;
      av = (av ?? '').toString().toLowerCase();
      bv = (bv ?? '').toString().toLowerCase();
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
  }
  return rows;
}

function uniqueValues(cfg, field) {
  const set = new Set();
  cfg.data.forEach(r => {
    const v = r[field];
    if (Array.isArray(v)) v.forEach(x => x && set.add(x));
    else if (v) set.add(v);
  });
  return Array.from(set).sort((a,b) => a.localeCompare(b, 'vi'));
}

function renderStats() {
  const bar = document.getElementById('stats-bar');
  const nHosp = DATA.hospitals.length;
  const nContractors = DATA.overview.length;
  const nDetails = DATA.details.length;
  const totalVal = DATA.ranking.reduce((s, r) => s + (r.total_value || 0), 0);
  bar.innerHTML = `
    <div class="stat-chip"><b>${nHosp}</b>bệnh viện</div>
    <div class="stat-chip"><b>${nContractors}</b>nhà thầu / đối thủ</div>
    <div class="stat-chip"><b>${nDetails.toLocaleString('vi-VN')}</b>dòng vật tư chi tiết</div>
    <div class="stat-chip"><b>${fmtVND(totalVal)}</b>tổng giá trị trúng thầu (ghi nhận)</div>
  `;
  document.getElementById('header-sub').textContent =
    `Tổng hợp dữ liệu đối thủ cạnh tranh từ ${nHosp} bệnh viện — tìm kiếm, lọc và so sánh nhà thầu trên toàn bộ dữ liệu.`;
}

function renderFilters() {
  const cfg = TABS[state.tab];
  const el = document.getElementById('filters');
  const hospitals = DATA.hospitals;
  const contractors = cfg.contractorField ? uniqueValues(cfg, cfg.contractorField) : (state.tab === 'overview' ? uniqueValues(cfg, 'contractor') : []);

  el.innerHTML = `
    <input type="text" id="search-input" placeholder="🔎 Tìm kiếm (tên nhà thầu, hàng hóa, hãng SX, mã thầu...)" value="${esc(state.search)}">
    <select id="hospital-select">
      <option value="">Tất cả bệnh viện</option>
      ${hospitals.map(h => `<option value="${esc(h)}" ${state.hospital===h?'selected':''}>${esc(h)}</option>`).join('')}
    </select>
    ${ (cfg.contractorField || state.tab==='overview') ? `
    <select id="contractor-select">
      <option value="">Tất cả nhà thầu</option>
      ${contractors.map(c => `<option value="${esc(c)}" ${state.contractor===c?'selected':''}>${esc(c)}</option>`).join('')}
    </select>` : ''}
    <button id="reset-btn">Xóa bộ lọc</button>
    <button id="export-btn" title="Xuất dữ liệu đang lọc/hiển thị ra file Excel">📥 Xuất Excel</button>
  `;

  document.getElementById('search-input').addEventListener('input', e => {
    state.search = e.target.value; state.page = 1; renderTable();
  });
  document.getElementById('hospital-select').addEventListener('change', e => {
    state.hospital = e.target.value; state.page = 1; renderTable();
  });
  const cSel = document.getElementById('contractor-select');
  if (cSel) {
    cSel.addEventListener('change', e => {
      state.contractor = e.target.value; state.page = 1; renderTable();
    });
  }
  document.getElementById('reset-btn').addEventListener('click', () => {
    state.search = ''; state.hospital = ''; state.contractor = '';
    state.page = 1; renderFilters(); renderTable();
  });
  document.getElementById('export-btn').addEventListener('click', exportToExcel);
}

// ==== Xuất Excel theo bệnh viện (dữ liệu đã lọc theo bộ lọc hiện tại) ====
function exportToExcel() {
  if (typeof XLSX === 'undefined') {
    alert('Không tải được thư viện xuất Excel (cần kết nối internet ở lần dùng đầu để tải thư viện). Vui lòng thử lại khi có mạng.');
    return;
  }

  const cfg = TABS[state.tab];
  let rows, columns;

  if (state.tab === 'pie') {
    // Tab biểu đồ tròn không có bảng cột sẵn -> lấy theo đúng logic hiển thị của tab này
    if (!state.hospital) {
      alert('Vui lòng chọn một bệnh viện ở bộ lọc phía trên trước khi xuất Excel cho tab này.');
      return;
    }
    rows = DATA.ranking.filter(r => r.hospital === state.hospital && r.tender_code);
    if (state.search) {
      const t = state.search.toLowerCase();
      rows = rows.filter(r =>
        (r.tender_code || '').toLowerCase().includes(t) ||
        (r.contractor || '').toLowerCase().includes(t)
      );
    }
    columns = [
      {key: 'hospital', label: 'Bệnh viện'},
      {key: 'tender_code', label: 'Mã thầu'},
      {key: 'contractor', label: 'Nhà thầu (đối thủ)'},
      {key: 'num_groups', label: 'Số nhóm SP trùng'},
      {key: 'num_packages', label: 'Số gói thắng'},
      {key: 'total_value', label: 'Tổng giá trị (VNĐ)'},
    ];
  } else {
    rows = getFiltered(); // đã áp dụng search + lọc bệnh viện + lọc nhà thầu + sắp xếp hiện tại
    columns = cfg.columns;
  }

  if (!rows.length) {
    alert('Không có dữ liệu để xuất theo bộ lọc hiện tại.');
    return;
  }

  const exportRows = rows.map(r => {
    const obj = {};
    columns.forEach(c => {
      let v = r[c.key];
      if (Array.isArray(v)) v = v.join(', ');
      if (v === null || v === undefined) v = '';
      obj[c.label] = v;
    });
    return obj;
  });

  const ws = XLSX.utils.json_to_sheet(exportRows);
  // Auto-fit độ rộng cột (ước lượng theo độ dài nội dung, tối đa 60 ký tự)
  const colWidths = columns.map(c => {
    let maxLen = c.label.length;
    exportRows.forEach(row => {
      const len = String(row[c.label] ?? '').length;
      if (len > maxLen) maxLen = len;
    });
    return {wch: Math.min(maxLen + 2, 60)};
  });
  ws['!cols'] = colWidths;

  const wb = XLSX.utils.book_new();
  const sheetName = (cfg.label || 'DuLieu').replace(/[\\/*?\[\]:]/g, ' ').slice(0, 31);
  XLSX.utils.book_append_sheet(wb, ws, sheetName || 'DuLieu');

  const hospitalPart = state.hospital ? state.hospital.replace(/[\\/:*?"<>|]/g, '') : 'TatCaBenhVien';
  const dateStr = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `DoiThuCanhTranh_${hospitalPart}_${state.tab}_${dateStr}.xlsx`);
}

const PIE_COLORS = ['#2563eb','#d97706','#059669','#dc2626','#7c3aed','#db2777','#0891b2','#65a30d','#ea580c','#4f46e5','#0d9488','#be123c','#854d0e','#166534','#9333ea','#0369a1','#b45309','#4d7c0f','#be185d','#5b21b6'];
function pieColor(i) { return PIE_COLORS[i % PIE_COLORS.length]; }

function polarPoint(cx, cy, r, angleDeg) {
  const rad = (angleDeg * Math.PI) / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}

function buildPieSVG(contractors, total) {
  const size = 168, cx = size/2, cy = size/2, r = 78;
  if (total <= 0 || contractors.length === 0) {
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#f1f5f9"/></svg>`;
  }
  if (contractors.length === 1) {
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${pieColor(0)}"><title>${esc(contractors[0][0])}: 100%</title></circle></svg>`;
  }
  let angleStart = -90;
  let paths = '';
  contractors.forEach(([name, val], idx) => {
    const angle = (val / total) * 360;
    let angleEnd = angleStart + angle;
    if (angleEnd - angleStart >= 359.999) angleEnd = angleStart + 359.999;
    const large = (angleEnd - angleStart) > 180 ? 1 : 0;
    const [x1, y1] = polarPoint(cx, cy, r, angleStart);
    const [x2, y2] = polarPoint(cx, cy, r, angleEnd);
    paths += `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${pieColor(idx)}" stroke="white" stroke-width="1"><title>${esc(name)}: ${(val/total*100).toFixed(1)}%</title></path>`;
    angleStart = angleEnd;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}</svg>`;
}

function renderPieCard(tenderCode, items) {
  const total = items.reduce((s, i) => s + (i.total_value || 0), 0);
  const contractors = items
    .map(i => [i.contractor || '(Không rõ)', i.total_value || 0])
    .sort((a, b) => b[1] - a[1]);
  const svg = buildPieSVG(contractors, total);
  const legend = contractors.map(([name, val], idx) => {
    const pct = total > 0 ? (val / total * 100) : 0;
    return `<div class="pie-legend-item">
      <span class="pie-swatch" style="background:${pieColor(idx)}"></span>
      <span class="pie-legend-name">${esc(name)}</span>
      <span class="pie-legend-pct">${pct.toFixed(1)}%</span>
    </div>`;
  }).join('');
  return `<div class="pie-card">
    <div class="pie-card-header"><span class="badge">${esc(tenderCode)}</span></div>
    <div class="pie-card-body">
      <div class="pie-svg-wrap">${svg}</div>
      <div class="pie-legend">${legend}</div>
    </div>
    <div class="pie-card-footer muted">Tổng giá trị: <b>${fmtVND(total)}</b> — ${contractors.length} nhà thầu trúng thầu</div>
  </div>`;
}

function renderPieView() {
  const container = document.getElementById('pie-container');
  if (!state.hospital) {
    container.innerHTML = '<div class="empty-state pie-hint">👆 Vui lòng chọn một <b>bệnh viện</b> ở bộ lọc phía trên để xem tỷ trọng % trúng thầu của từng nhà thầu theo từng mã thầu.</div>';
    return;
  }
  let rows = DATA.ranking.filter(r => r.hospital === state.hospital && r.tender_code);
  if (state.search) {
    const t = state.search.toLowerCase();
    rows = rows.filter(r =>
      (r.tender_code || '').toLowerCase().includes(t) ||
      (r.contractor || '').toLowerCase().includes(t)
    );
  }
  const byTender = {};
  rows.forEach(r => {
    if (!byTender[r.tender_code]) byTender[r.tender_code] = [];
    byTender[r.tender_code].push(r);
  });
  const tenderCodes = Object.keys(byTender).sort();
  if (tenderCodes.length === 0) {
    container.innerHTML = '<div class="empty-state">Không tìm thấy mã thầu phù hợp cho bệnh viện này.</div>';
    return;
  }
  container.innerHTML = `<div class="pie-grid">${tenderCodes.map(code => renderPieCard(code, byTender[code])).join('')}</div>`;
}

function renderTable() {
  const cfg = TABS[state.tab];
  if (state.tab === 'pie') {
    document.getElementById('table-wrap').style.display = 'none';
    document.getElementById('pagination').style.display = 'none';
    document.getElementById('pie-container').style.display = 'block';
    renderPieView();
    return;
  }
  document.getElementById('table-wrap').style.display = '';
  document.getElementById('pagination').style.display = '';
  document.getElementById('pie-container').style.display = 'none';
  const rows = getFiltered();
  const table = document.getElementById('data-table');
  const sortKey = state.sortKey || (cfg.defaultSort && cfg.defaultSort.key);
  const sortDir = state.sortKey ? state.sortDir : (cfg.defaultSort ? cfg.defaultSort.dir : 'asc');

  const thead = `<thead><tr>${cfg.columns.map(c => {
    let arrow = '';
    if (c.sortable) {
      arrow = sortKey === c.key ? (sortDir === 'asc' ? '▲' : '▼') : '↕';
    }
    return `<th data-key="${c.key}" data-sortable="${!!c.sortable}">${esc(c.label)} ${c.sortable ? `<span class="arrow">${arrow}</span>` : ''}</th>`;
  }).join('')}</tr></thead>`;

  const totalRows = rows.length;
  const totalPages = Math.max(1, Math.ceil(totalRows / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;
  const start = (state.page - 1) * state.pageSize;
  const pageRows = rows.slice(start, start + state.pageSize);

  let tbody;
  if (pageRows.length === 0) {
    tbody = `<tbody><tr><td colspan="${cfg.columns.length}"><div class="empty-state">Không tìm thấy kết quả phù hợp.</div></td></tr></tbody>`;
  } else {
    tbody = '<tbody>' + pageRows.map(r => {
      return '<tr>' + cfg.columns.map(c => {
        const val = c.render ? c.render(r) : esc(r[c.key] ?? '—');
        return `<td class="${c.cls || ''}">${val}</td>`;
      }).join('') + '</tr>';
    }).join('') + '</tbody>';
  }

  table.innerHTML = thead + tbody;

  table.querySelectorAll('th[data-sortable=true]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.getAttribute('data-key');
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = key;
        state.sortDir = 'desc';
      }
      renderTable();
    });
  });

  renderPagination(totalRows, totalPages);
}

function renderPagination(totalRows, totalPages) {
  const el = document.getElementById('pagination');
  el.innerHTML = `
    <button id="prev-btn" ${state.page<=1?'disabled':''}>‹ Trước</button>
    <span>Trang ${state.page}/${totalPages} — ${totalRows.toLocaleString('vi-VN')} kết quả</span>
    <button id="next-btn" ${state.page>=totalPages?'disabled':''}>Sau ›</button>
  `;
  document.getElementById('prev-btn').addEventListener('click', () => { state.page--; renderTable(); });
  document.getElementById('next-btn').addEventListener('click', () => { state.page++; renderTable(); });
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    state.search = ''; state.hospital = ''; state.contractor = '';
    state.sortKey = null; state.sortDir = 'asc'; state.page = 1;
    renderFilters();
    renderTable();
  });
});

function initApp() {
  const tableWrapEl = document.getElementById('table-wrap');
  if (tableWrapEl) tableWrapEl.innerHTML = '<table id="data-table"></table>';
  renderStats();
  renderFilters();
  renderTable();
}

const tableWrapEl = document.getElementById('table-wrap');
if (tableWrapEl) tableWrapEl.innerHTML = '<p style="padding:20px;text-align:center;color:#666;">Đang tải dữ liệu...</p>';

fetch('data.json')
  .then(res => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(json => {
    DATA = json;
    initApp();
  })
  .catch(err => {
    console.error('Lỗi tải data.json:', err);
    if (tableWrapEl) tableWrapEl.innerHTML = '<p style="padding:20px;text-align:center;color:#c00;">Không tải được data.json. Kiểm tra file có nằm cùng thư mục với index.html không.</p>';
  });
</script>
